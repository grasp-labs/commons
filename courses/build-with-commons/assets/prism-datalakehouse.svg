<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Prism datalakehouse flow</title>
  <desc id="desc">A connected source enters a dataset, moves through Prism bronze and silver stages, publishes a gold Facet and is queried through DS-Fetch.</desc>
  <defs>
    <radialGradient id="bg" cx="88%" cy="15%" r="72%">
      <stop offset="0" stop-color="#dcefd1"/>
      <stop offset=".45" stop-color="#f7faf5"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#5e6d57"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <g font-family="Geist, Inter, system-ui, sans-serif" fill="#172012">
    <text x="70" y="82" font-size="34" font-weight="600">Build a datalakehouse with Prism</text>
    <text x="70" y="119" font-size="18" fill="#5e6d57">A regular dataset is the source; a Facet is governed Gold</text>

    <rect x="64" y="244" width="176" height="146" rx="18" fill="#fff" stroke="#d8e5d0" stroke-width="2"/>
    <text x="92" y="286" font-size="14" fill="#5e6d57" letter-spacing="2">CONNECT</text>
    <text x="92" y="327" font-size="24" font-weight="600">Source</text>
    <text x="92" y="359" font-size="16" fill="#5e6d57">Vault credentials</text>

    <path d="M240 317H294" stroke="#5e6d57" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="308" y="244" width="176" height="146" rx="18" fill="#fff" stroke="#d8e5d0" stroke-width="2"/>
    <text x="336" y="286" font-size="14" fill="#5e6d57" letter-spacing="2">DEFINE</text>
    <text x="336" y="327" font-size="24" font-weight="600">Dataset</text>
    <text x="336" y="359" font-size="16" fill="#5e6d57">Source contract</text>

    <path d="M484 317H538" stroke="#5e6d57" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="552" y="190" width="278" height="254" rx="22" fill="#172012"/>
    <text x="582" y="232" font-size="14" fill="#adfa1d" letter-spacing="2">PRISM / PIPELINE</text>
    <rect x="582" y="260" width="218" height="54" rx="10" fill="#c2410c"/>
    <text x="606" y="294" font-size="18" font-weight="600" fill="#fff">Bronze / source evidence</text>
    <path d="M691 314v30" stroke="#d8e5d0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="582" y="354" width="218" height="54" rx="10" fill="#64748b"/>
    <text x="606" y="388" font-size="18" font-weight="600" fill="#fff">Silver / typed SQL</text>

    <path d="M830 317H884" stroke="#5e6d57" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="898" y="220" width="238" height="194" rx="20" fill="#fff" stroke="#ca8a04" stroke-width="3"/>
    <text x="928" y="266" font-size="14" fill="#8a6500" letter-spacing="2">GOLD</text>
    <text x="928" y="308" font-size="28" font-weight="600">Facet</text>
    <text x="928" y="341" font-size="16" fill="#5e6d57">Key / history / schema</text>
    <rect x="928" y="365" width="128" height="30" rx="8" fill="#f6edc8"/>
    <text x="946" y="386" font-size="14" fill="#684d00">DS-Fetch ready</text>

    <path d="M1017 414v66" stroke="#3d7a1c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="872" y="496" width="264" height="74" rx="14" fill="#e0ead9"/>
    <text x="904" y="527" font-size="18" font-weight="600">preview / query</text>
    <text x="904" y="551" font-size="15" fill="#5e6d57">Verify before scheduling</text>

    <text x="70" y="552" font-size="17" font-weight="600">Contract first</text>
    <text x="70" y="582" font-size="16" fill="#5e6d57">Stable primary key / ordering field / history mode / partitions</text>
    <text x="70" y="610" font-size="16" fill="#5e6d57">Run in dev / reconcile counts / then schedule or attach a webhook</text>
  </g>
</svg>
