<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Natural language to governed data answer</title>
  <desc id="desc">A question is grounded by preview, drafted into SQL, reviewed, executed by query and returned with source provenance.</desc>
  <defs>
    <radialGradient id="bg" cx="88%" cy="12%" r="75%">
      <stop offset="0" stop-color="#dcefd1"/>
      <stop offset=".4" stop-color="#f5f9f1"/>
      <stop offset="1" stop-color="#fcfdfb"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#3d7a1c"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <g font-family="Geist, Inter, system-ui, sans-serif" fill="#172012">
    <text x="70" y="82" font-size="34" font-weight="600">Talk to data without skipping review</text>
    <text x="70" y="119" font-size="18" fill="#5e6d57">Understanding, drafting and execution are separate steps</text>

    <rect x="62" y="230" width="198" height="154" rx="18" fill="#fff" stroke="#d8e5d0" stroke-width="2"/>
    <text x="90" y="270" font-size="14" fill="#5e6d57" letter-spacing="2">QUESTION</text>
    <text x="90" y="310" font-size="21" font-weight="600">Revenue by</text>
    <text x="90" y="339" font-size="21" font-weight="600">month this year?</text>

    <path d="M260 307H302" stroke="#3d7a1c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="316" y="230" width="198" height="154" rx="18" fill="#fff" stroke="#d8e5d0" stroke-width="2"/>
    <text x="344" y="270" font-size="14" fill="#3d7a1c" letter-spacing="2">PREVIEW</text>
    <text x="344" y="310" font-size="21" font-weight="600">Ground in schema</text>
    <text x="344" y="341" font-size="15" fill="#5e6d57">rows: 0</text>
    <text x="344" y="365" font-size="15" fill="#5e6d57">columns / sql_ref / history</text>

    <path d="M514 307H556" stroke="#3d7a1c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="570" y="230" width="198" height="154" rx="18" fill="#fff" stroke="#d8e5d0" stroke-width="2"/>
    <text x="598" y="270" font-size="14" fill="#3d7a1c" letter-spacing="2">DRAFT SQL</text>
    <text x="598" y="310" font-size="21" font-weight="600">Draft only</text>
    <text x="598" y="341" font-size="15" fill="#5e6d57">One SELECT or WITH</text>
    <text x="598" y="365" font-size="15" fill="#5e6d57">Nothing executed</text>

    <path d="M768 307H810" stroke="#3d7a1c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="824" y="206" width="314" height="202" rx="18" fill="#172012"/>
    <text x="854" y="248" font-size="14" fill="#adfa1d" letter-spacing="2">REVIEW / QUERY</text>
    <text x="854" y="289" font-size="21" font-weight="600" fill="#fff">Check before execution</text>
    <text x="854" y="322" font-size="16" fill="#d8e5d0">tables / grain / filters / units</text>
    <text x="854" y="350" font-size="16" fill="#d8e5d0">sensitive fields / max_rows</text>
    <rect x="854" y="370" width="176" height="25" rx="7" fill="#e0ead9"/>
    <text x="871" y="388" font-size="13" fill="#23351a">read-only execution</text>

    <path d="M981 408v60" stroke="#3d7a1c" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="742" y="484" width="396" height="112" rx="18" fill="#fff" stroke="#d8e5d0" stroke-width="2"/>
    <text x="772" y="525" font-size="14" fill="#3d7a1c" letter-spacing="2">ANSWER WITH PROVENANCE</text>
    <text x="772" y="561" font-size="18" font-weight="600">Result / dataset / filters / time range</text>

    <rect x="62" y="454" width="604" height="142" rx="18" fill="#e7eee1"/>
    <text x="92" y="496" font-size="18" font-weight="600">Safe defaults</text>
    <text x="92" y="530" font-size="16" fill="#5e6d57">Aggregate first / ask before identifiable rows</text>
    <text x="92" y="558" font-size="16" fill="#5e6d57">Never invent missing values / distinguish empty from failed</text>
  </g>
</svg>
